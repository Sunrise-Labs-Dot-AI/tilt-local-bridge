name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - run: python tools/check_public_tree.py
      - run: bash -n scripts/install.sh

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shade-remote
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/shade-remote/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install pytest-homeassistant-custom-component
      - name: Install the Bluetooth component requirements
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys, homeassistant
          base = pathlib.Path(homeassistant.__file__).parent / "components"
          reqs = sorted({r for comp in ("bluetooth", "usb", "bluetooth_adapters") for r in json.load(open(base / comp / "manifest.json")).get("requirements", [])})
          subprocess.check_call([sys.executable, "-m", "pip", "install", *reqs])
          PY
      - run: python -m pytest tests_ha -q

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" "$release/$archive"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/checksums.txt" "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  $archive$" "$RUNNER_TEMP/checksums.txt" > "$RUNNER_TEMP/checksum"
          cd "$RUNNER_TEMP"
          sha256sum --check checksum
          tar --extract --gzip --file "$archive" gitleaks
      - name: Scan git history for secrets
        run: "$RUNNER_TEMP/gitleaks git --redact --no-banner"
